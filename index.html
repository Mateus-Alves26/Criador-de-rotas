<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roteirizador de Entregas</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SheetJS (Excel) -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
            color: #1f2937;
        }

        /* Ocultar scrollbar mantendo a funcionalidade */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center py-6 px-4 sm:px-6 md:py-10">

    <div class="w-full max-w-2xl bg-white rounded-3xl shadow-xl overflow-hidden flex flex-col">
        <!-- Header -->
        <div class="bg-blue-600 p-6 text-white text-center">
            <h1 class="text-2xl font-bold flex items-center justify-center gap-2">
                <i class="ph-fill ph-map-pin-line text-3xl"></i>
                Roteirizador Maps
            </h1>
            <p class="text-blue-100 text-sm mt-1">Validação de CEP e geração de rotas</p>
        </div>

        <div class="p-6 flex flex-col gap-6">
            <!-- Upload Section -->
            <div id="uploadSection" class="flex flex-col items-center">
                <label for="fileInput" class="w-full flex flex-col items-center justify-center h-40 border-2 border-dashed border-blue-300 rounded-2xl bg-blue-50 cursor-pointer hover:bg-blue-100 transition-colors group">
                    <i class="ph ph-file-xls text-4xl text-blue-500 mb-2 group-hover:scale-110 transition-transform"></i>
                    <span class="text-sm font-semibold text-blue-700">Toque para selecionar a planilha</span>
                    <span class="text-xs text-blue-500 mt-1">Apenas arquivos .xlsx</span>
                </label>
                <input type="file" id="fileInput" accept=".xlsx" class="hidden">
            </div>

            <!-- Error Message -->
            <div id="errorMessage" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded-xl text-sm fade-in relative" role="alert">
                <span class="block sm:inline" id="errorText">Erro aqui.</span>
            </div>

            <!-- Progress Section (Hidden by default) -->
            <div id="progressSection" class="hidden flex-col gap-3 fade-in">
                <div class="flex justify-between items-end">
                    <div class="text-sm font-semibold text-gray-700" id="progressStatus">Processando...</div>
                    <div class="text-sm font-bold text-blue-600" id="progressCount">0 / 0</div>
                </div>
                <div class="w-full bg-gray-200 rounded-full h-3 overflow-hidden">
                    <div id="progressBar" class="bg-blue-600 h-3 rounded-full transition-all duration-300 w-0"></div>
                </div>
                
                <!-- Estatísticas rápidas -->
                <div class="grid grid-cols-3 gap-2 mt-2 text-center text-xs font-semibold">
                    <div class="bg-green-100 text-green-700 p-2 rounded-lg flex flex-col">
                        <span class="text-lg" id="countOk">0</span>
                        <span>OK</span>
                    </div>
                    <div class="bg-yellow-100 text-yellow-700 p-2 rounded-lg flex flex-col">
                        <span class="text-lg" id="countDiv">0</span>
                        <span>Divergente</span>
                    </div>
                    <div class="bg-red-100 text-red-700 p-2 rounded-lg flex flex-col">
                        <span class="text-lg" id="countErr">0</span>
                        <span>Não Encontrado</span>
                    </div>
                </div>
            </div>

            <!-- Results List -->
            <div id="resultsList" class="hidden flex-col gap-3 max-h-80 overflow-y-auto no-scrollbar pb-2">
                <!-- Cards serão injetados aqui -->
            </div>

            <!-- Download Button (Hidden by default) -->
            <button id="downloadBtn" class="hidden w-full bg-green-500 hover:bg-green-600 text-white font-bold py-4 rounded-2xl flex items-center justify-center gap-2 transition-colors fade-in shadow-lg shadow-green-500/30">
                <i class="ph-bold ph-download-simple text-xl"></i>
                Baixar Planilha Processada
            </button>
        </div>
    </div>

    <script>
        // --- Constantes e Variáveis Globais ---
        const LIMIAR_SIMILARIDADE = 0.6;
        const PREFIXOS_LOGRADOURO = [
            "RUA", "R", "AV", "AVENIDA", "AL", "ALAMEDA", "ESTRADA", "EST",
            "ROD", "RODOVIA", "TRAVESSA", "TV", "PRACA", "PC", "LARGO",
            "VIA", "VIELA", "LADEIRA"
        ];
        
        let originalFileName = "";
        let processedData = [];
        let stats = { ok: 0, divergente: 0, naoEncontrado: 0 };

        // Elementos da UI
        const fileInput = document.getElementById('fileInput');
        const uploadSection = document.getElementById('uploadSection');
        const progressSection = document.getElementById('progressSection');
        const progressStatus = document.getElementById('progressStatus');
        const progressCount = document.getElementById('progressCount');
        const progressBar = document.getElementById('progressBar');
        const resultsList = document.getElementById('resultsList');
        const downloadBtn = document.getElementById('downloadBtn');
        const errorMessage = document.getElementById('errorMessage');
        const errorText = document.getElementById('errorText');

        const countOk = document.getElementById('countOk');
        const countDiv = document.getElementById('countDiv');
        const countErr = document.getElementById('countErr');

        // --- Utilitários ---
        const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

        function showError(msg) {
            errorText.textContent = msg;
            errorMessage.classList.remove('hidden');
            setTimeout(() => errorMessage.classList.add('hidden'), 5000);
        }

        function resetUI() {
            errorMessage.classList.add('hidden');
            progressSection.classList.remove('hidden');
            resultsList.innerHTML = '';
            resultsList.classList.remove('hidden');
            downloadBtn.classList.add('hidden');
            stats = { ok: 0, divergente: 0, naoEncontrado: 0 };
            updateStatsUI();
            progressBar.style.width = '0%';
        }

        function updateStatsUI() {
            countOk.textContent = stats.ok;
            countDiv.textContent = stats.divergente;
            countErr.textContent = stats.naoEncontrado;
        }

        // --- Lógica de Negócio (Portado do Python) ---

        function normalizar(texto) {
            if (texto === null || texto === undefined) return "";
            let txt = String(texto).trim().toUpperCase();
            if (txt === "NAN") return "";
            
            // Remove acentos
            txt = txt.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
            // Substitui o que não for alfanumérico por espaço
            txt = txt.replace(/[^A-Z0-9\s]/g, " ");
            
            // Remove espaços extras e filtra prefixos
            let palavras = txt.split(/\s+/).filter(p => !PREFIXOS_LOGRADOURO.includes(p) && p.length > 0);
            return palavras.join(" ");
        }

        // Distância de Levenshtein (base para similaridade)
        function levenshtein(a, b) {
            const matrix = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
            for (let i = 0; i <= a.length; i++) matrix[i][0] = i;
            for (let j = 0; j <= b.length; j++) matrix[0][j] = j;

            for (let i = 1; i <= a.length; i++) {
                for (let j = 1; j <= b.length; j++) {
                    const cost = a[i - 1] === b[j - 1] ? 0 : 1;
                    matrix[i][j] = Math.min(
                        matrix[i - 1][j] + 1,
                        matrix[i][j - 1] + 1,
                        matrix[i - 1][j - 1] + cost
                    );
                }
            }
            return matrix[a.length][b.length];
        }

        function similaridade(a, b) {
            const aNorm = normalizar(a);
            const bNorm = normalizar(b);
            if (!aNorm || !bNorm) return 0.0;
            
            // Se um contiver o outro perfeitamente, já é 100% (igual ao Python)
            if (aNorm.includes(bNorm) || bNorm.includes(aNorm)) return 1.0;

            const dist = levenshtein(aNorm, bNorm);
            const totalLen = aNorm.length + bNorm.length;
            if (totalLen === 0) return 0.0;
            
            // Fórmula similar ao difflib.SequenceMatcher.ratio()
            return (totalLen - dist) / totalLen;
        }

        async function consultarCep(cep, tentativas = 2) {
            const cepLimpo = String(cep).replace(/\D/g, '');
            if (cepLimpo.length !== 8) return null;

            for (let t = 0; t < tentativas; t++) {
                try {
                    const response = await fetch(`https://viacep.com.br/ws/${cepLimpo}/json/`);
                    if (!response.ok) throw new Error("Erro na rede");
                    const dados = await response.json();
                    return dados.erro ? null : dados;
                } catch (error) {
                    if (t < tentativas - 1) await sleep(1000);
                }
            }
            return null;
        }

        function montarLinkMaps(endereco, numero, bairro, cidade, cep) {
            const partes = [endereco, numero, bairro, cidade, "SP", cep]
                .map(p => String(p === null || p === undefined ? "" : p).trim())
                .filter(p => p.toLowerCase() !== "nan" && p !== "");
            
            const query = encodeURIComponent(partes.join(", "));
            return `https://www.google.com/maps/search/?api=1&query=${query}`;
        }

        async function verificarParada(endereco, bairro, cidade, cep) {
            const dados = await consultarCep(cep);
            if (!dados) return "NAO ENCONTRADO";

            const logradouroOficial = dados.logradouro || "";
            const cidadeOficial = dados.localidade || "";

            if (logradouroOficial) {
                return similaridade(endereco, logradouroOficial) >= LIMIAR_SIMILARIDADE ? "OK" : "DIVERGENTE";
            }

            // CEP de área (sem rua específica)
            return similaridade(cidade, cidadeOficial) >= LIMIAR_SIMILARIDADE ? "OK (CEP de area)" : "DIVERGENTE";
        }

        function criarCard(seq, destinatario, status, link) {
            const card = document.createElement('div');
            card.className = "bg-white border border-gray-100 rounded-xl p-4 shadow-sm flex items-center justify-between gap-3 fade-in";
            
            let statusBadge = "";
            let icon = "";
            
            if (status.startsWith("OK")) {
                statusBadge = "bg-green-100 text-green-700";
                icon = "<i class='ph-fill ph-check-circle text-green-500 text-xl'></i>";
                stats.ok++;
            } else if (status === "DIVERGENTE") {
                statusBadge = "bg-yellow-100 text-yellow-700";
                icon = "<i class='ph-fill ph-warning-circle text-yellow-500 text-xl'></i>";
                stats.divergente++;
            } else {
                statusBadge = "bg-red-100 text-red-700";
                icon = "<i class='ph-fill ph-x-circle text-red-500 text-xl'></i>";
                stats.naoEncontrado++;
            }

            card.innerHTML = `
                <div class="flex items-center gap-3 overflow-hidden">
                    <div class="flex-shrink-0 w-8 text-center font-bold text-gray-400 text-sm">#${seq}</div>
                    <div class="flex flex-col min-w-0">
                        <span class="font-semibold text-gray-800 truncate text-sm">${destinatario || 'Sem Nome'}</span>
                        <div class="flex items-center gap-1 mt-1">
                            ${icon}
                            <span class="text-[10px] font-bold px-2 py-0.5 rounded-md ${statusBadge}">${status}</span>
                        </div>
                    </div>
                </div>
                <a href="${link}" target="_blank" class="flex-shrink-0 w-10 h-10 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center hover:bg-blue-100 transition-colors">
                    <i class="ph-bold ph-map-pin text-lg"></i>
                </a>
            `;
            
            resultsList.appendChild(card);
            // Auto scroll para o último item adicionado
            resultsList.scrollTop = resultsList.scrollHeight;
        }

        fileInput.addEventListener('change', async (event) => {
            const file = event.target.files[0];
            if (!file) return;
            
            originalFileName = file.name;
            const reader = new FileReader();

            reader.onload = async (e) => {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, {type: 'array'});
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    
                    // Converter para JSON preenchendo células vazias
                    let jsonData = XLSX.utils.sheet_to_json(worksheet, { defval: "" });
                    
                    if (jsonData.length === 0) {
                        showError("A planilha está vazia.");
                        return;
                    }

                    // Validação de colunas obrigatórias
                    const colunasEsperadas = ["Endereço", "N°", "Bairro", "Cidade", "CEP", "Seq", "Destinatario"];
                    const colunasPlanilha = Object.keys(jsonData[0]);
                    const faltando = colunasEsperadas.filter(col => !colunasPlanilha.includes(col));
                    
                    if (faltando.length > 0) {
                        showError(`Colunas faltando na planilha: ${faltando.join(", ")}`);
                        return;
                    }

                    resetUI();

                    // Ordenar numéricamente pela coluna 'Seq'
                    jsonData.sort((a, b) => {
                        const valA = parseFloat(a['Seq']) || 0;
                        const valB = parseFloat(b['Seq']) || 0;
                        return valA - valB;
                    });

                    processedData = [];
                    const total = jsonData.length;

                    // Iteração linha a linha (com delay)
                    for (let i = 0; i < total; i++) {
                        const linha = jsonData[i];
                        
                        progressStatus.textContent = `Consultando CEP...`;
                        progressCount.textContent = `${i + 1} / ${total}`;
                        
                        const endereco = linha["Endereço"];
                        const bairro = linha["Bairro"];
                        const cidade = linha["Cidade"];
                        const cep = linha["CEP"];
                        const numero = linha["N°"];
                        const dest = linha["Destinatario"];
                        const seq = linha["Seq"];

                        const status = await verificarParada(endereco, bairro, cidade, cep);
                        const link = montarLinkMaps(endereco, numero, bairro, cidade, cep);

                        // Cria nova linha processada
                        const linhaProcessada = { ...linha };
                        linhaProcessada["Status Verificacao"] = status;
                        linhaProcessada["Link Maps"] = link;
                        
                        processedData.push(linhaProcessada);
                        
                        criarCard(seq, dest, status, link);
                        updateStatsUI();

                        const percent = Math.round(((i + 1) / total) * 100);
                        progressBar.style.width = `${percent}%`;

                        // Delay para não bloquear a API do ViaCEP
                        if (i < total - 1) {
                            await sleep(300);
                        }
                    }

                    progressStatus.textContent = `Concluído! ${stats.divergente} divergente(s) | ${stats.naoEncontrado} erro(s)`;
                    downloadBtn.classList.remove('hidden');

                } catch (err) {
                    console.error(err);
                    showError("Erro ao processar o arquivo. Verifique o formato.");
                } finally {
                    // Reseta o input de arquivo para permitir reenviar o mesmo arquivo
                    fileInput.value = '';
                }
            };

            reader.readAsArrayBuffer(file);
        });

        downloadBtn.addEventListener('click', () => {
            if (processedData.length === 0) return;

            // Converter JSON processado de volta para Worksheet
            const newWorksheet = XLSX.utils.json_to_sheet(processedData);
            
            // Ajustar largura das colunas
            const colsInfo = Object.keys(processedData[0]).map(k => ({ wch: Math.max(k.length, 15) }));
            newWorksheet['!cols'] = colsInfo;

            // Criar um novo Workbook e adicionar a planilha
            const newWorkbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(newWorkbook, newWorksheet, "Rota Processada");

            // Gera o nome final (_com_links.xlsx)
            let baseName = originalFileName;
            if (baseName.includes(".")) {
                baseName = baseName.substring(0, baseName.lastIndexOf('.'));
            }
            const finalFileName = `${baseName}_com_links.xlsx`;

            // Exportar e Baixar
            XLSX.writeFile(newWorkbook, finalFileName);
        });
    </script>
</body>
</html>
