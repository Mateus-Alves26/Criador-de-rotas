<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criador de Rotas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SheetJS para ler a planilha -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans p-4 sm:p-8">
    <div class="max-w-xl mx-auto bg-white rounded-xl shadow-lg overflow-hidden p-6 sm:p-8 border border-gray-100">
        <h1 class="text-2xl font-bold mb-2 text-center text-blue-600">Gerador de Links de Rota</h1>
        <p class="text-sm text-gray-500 mb-6 text-center">Gere uma lista em .txt com os links do Google Maps</p>
        
        <div class="mb-6">
            <label class="block text-sm font-semibold text-gray-700 mb-2">Selecione a planilha (.xlsx)</label>
            <input type="file" id="fileInput" accept=".xlsx" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2.5 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 transition-colors cursor-pointer border border-gray-200 rounded-md" />
        </div>

        <button id="processBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-md disabled:opacity-50 disabled:cursor-not-allowed transition-colors shadow-sm" disabled>
            Processar e Baixar lista .txt
        </button>

        <div id="statusArea" class="mt-6 hidden">
            <div class="flex justify-between items-center mb-2 text-sm font-medium text-gray-700">
                <span>Progresso da verificação:</span>
                <span><span id="progress">0</span> / <span id="total">0</span></span>
            </div>
            <div class="w-full bg-gray-200 rounded-full h-2.5">
                <div id="progressBar" class="bg-blue-600 h-2.5 rounded-full" style="width: 0%"></div>
            </div>
        </div>

        <div id="log" class="mt-6 h-64 overflow-y-auto bg-slate-50 p-3 border border-slate-200 rounded-md text-xs font-mono whitespace-pre-wrap hidden text-slate-700"></div>
    </div>

    <script>
        const PREFIXOS_LOGRADOURO = new Set([
            "RUA", "R", "AV", "AVENIDA", "AL", "ALAMEDA", "ESTRADA", "EST",
            "ROD", "RODOVIA", "TRAVESSA", "TV", "PRACA", "PC", "LARGO",
            "VIA", "VIELA", "LADEIRA"
        ]);

        function normalizar(texto) {
            if (!texto) return "";
            texto = String(texto).trim().toUpperCase();
            if (texto === "NAN") return "";
            texto = texto.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
            texto = texto.replace(/[^A-Z0-9\s]/g, " ");
            let palavras = texto.split(/\s+/).filter(p => !PREFIXOS_LOGRADOURO.has(p));
            return palavras.join(" ");
        }

        function similaridade(a, b) {
            const a_norm = normalizar(a);
            const b_norm = normalizar(b);
            if (!a_norm || !b_norm) return 0.0;
            if (a_norm.includes(b_norm) || b_norm.includes(a_norm)) return 1.0;
            
            const palavrasA = a_norm.split(" ");
            const palavrasB = b_norm.split(" ");
            const intersecao = palavrasA.filter(p => palavrasB.includes(p));
            return intersecao.length / Math.max(palavrasA.length, palavrasB.length);
        }

        const LIMIAR_SIMILARIDADE = 0.6;

        async function consultarCep(cep, tentativas = 2) {
            let cep_limpo = String(cep).replace(/\D/g, "");
            if (cep_limpo.length !== 8) return null;

            for (let i = 0; i < tentativas; i++) {
                try {
                    const resp = await fetch(`https://viacep.com.br/ws/${cep_limpo}/json/`);
                    const dados = await resp.json();
                    return dados.erro ? null : dados;
                } catch (e) {
                    if (i < tentativas - 1) await new Promise(r => setTimeout(r, 1000));
                }
            }
            return null;
        }

        function montarLinkMaps(endereco, numero, bairro, cidade, cep) {
            const partes = [endereco, numero, bairro, cidade, "SP", cep]
                .filter(p => p != null && String(p).trim().toLowerCase() !== "nan" && String(p).trim() !== "");
            const query = encodeURIComponent(partes.join(", "));
            return `https://www.google.com/maps/search/?api=1&query=${query}`;
        }

        async function verificarParada(endereco, bairro, cidade, cep) {
            const dados = await consultarCep(cep);
            if (!dados) return "NAO ENCONTRADO";

            const logradouro_oficial = dados.logradouro || "";
            const cidade_oficial = dados.localidade || "";

            if (logradouro_oficial) {
                return similaridade(endereco, logradouro_oficial) >= LIMIAR_SIMILARIDADE ? "OK" : "DIVERGENTE";
            }
            return similaridade(cidade, cidade_oficial) >= LIMIAR_SIMILARIDADE ? "OK (CEP de area)" : "DIVERGENTE";
        }

        const fileInput = document.getElementById('fileInput');
        const processBtn = document.getElementById('processBtn');
        const statusArea = document.getElementById('statusArea');
        const progressSpan = document.getElementById('progress');
        const totalSpan = document.getElementById('total');
        const progressBar = document.getElementById('progressBar');
        const logDiv = document.getElementById('log');

        fileInput.addEventListener('change', (e) => {
            processBtn.disabled = !e.target.files[0];
        });

        processBtn.addEventListener('click', async () => {
            const file = fileInput.files[0];
            if (!file) return;

            processBtn.disabled = true;
            fileInput.disabled = true;
            statusArea.classList.remove('hidden');
            logDiv.classList.remove('hidden');
            logDiv.innerHTML = "Iniciando leitura da planilha...\n\n";
            progressBar.style.width = "0%";

            const reader = new FileReader();
            reader.onload = async (e) => {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, {type: 'array'});
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    let rows = XLSX.utils.sheet_to_json(worksheet, {defval: ""});

                    const colunas_esperadas = ["Endereço", "N°", "Bairro", "Cidade", "CEP", "Seq", "Destinatario"];
                    if (rows.length > 0) {
                        const header = Object.keys(rows[0]);
                        const faltando = colunas_esperadas.filter(c => !header.includes(c));
                        if (faltando.length > 0) {
                            alert(`Erro: Colunas faltando na planilha: ${faltando.join(", ")}`);
                            resetUI();
                            return;
                        }
                    } else {
                        alert("A planilha está vazia.");
                        resetUI();
                        return;
                    }

                    // Tratar a coluna Sequência para manter a ordem da rota
                    rows.forEach(r => r.Seq = isNaN(Number(r.Seq)) || r.Seq === "" ? 9999 : Number(r.Seq));
                    rows.sort((a, b) => a.Seq - b.Seq);

                    const total = rows.length;
                    totalSpan.textContent = total;
                    
                    // Cabeçalho do arquivo TXT
                    let txtContent = "=========================================\n";
                    txtContent += "          LINKS DE ROTA (MAPS)\n";
                    txtContent += "=========================================\n\n";

                    for (let i = 0; i < total; i++) {
                        const currentProgress = i + 1;
                        progressSpan.textContent = currentProgress;
                        progressBar.style.width = `${(currentProgress / total) * 100}%`;
                        
                        const linha = rows[i];

                        const status = await verificarParada(linha["Endereço"], linha["Bairro"], linha["Cidade"], linha["CEP"]);
                        const link = montarLinkMaps(linha["Endereço"], linha["N°"], linha["Bairro"], linha["Cidade"], linha["CEP"]);

                        const seq_str = linha.Seq === 9999 ? "?" : linha.Seq.toString().padStart(2, '0');
                        const msgLog = `[Seq ${seq_str}] ${linha["Destinatario"]} -- ${status}\nLink: ${link}\n\n`;
                        
                        // Adiciona ao TXT e mostra na tela
                        txtContent += msgLog;
                        logDiv.innerHTML += msgLog;
                        logDiv.scrollTop = logDiv.scrollHeight;

                        // Pausa de 300ms para não sobrecarregar a API do ViaCEP
                        await new Promise(r => setTimeout(r, 300));
                    }

                    // Lógica para forçar o download do arquivo .txt
                    const blob = new Blob([txtContent], { type: "text/plain;charset=utf-8" });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement("a");
                    a.href = url;
                    const originalName = file.name.replace(/\.[^/.]+$/, "");
                    a.download = `${originalName}_links.txt`; 
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);

                    logDiv.innerHTML += "=========================================\n";
                    logDiv.innerHTML += "PROCESSAMENTO CONCLUÍDO!\nO arquivo .txt foi baixado automaticamente.\n";
                    logDiv.scrollTop = logDiv.scrollHeight;
                    
                } catch (error) {
                    alert("Ocorreu um erro ao processar a planilha.");
                    console.error(error);
                } finally {
                    resetUI(false);
                }
            };
            reader.readAsArrayBuffer(file);
        });

        function resetUI(clearFile = true) {
            processBtn.disabled = false;
            fileInput.disabled = false;
            if (clearFile) fileInput.value = "";
        }
    </script>
</body>
</html>
